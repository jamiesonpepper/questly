<div class="decide">
  <form method="post" action="{{ url_for('parent.decide_redemption_route', redemption_id=r._id) }}">
    {{ csrf_field() }}
    <input type="hidden" name="next" value="{{ request.path }}">
    <button class="btn btn--go btn--sm" type="submit" name="decision" value="approve">Given</button>
  </form>
  <form method="post" action="{{ url_for('parent.decide_redemption_route', redemption_id=r._id) }}">
    {{ csrf_field() }}
    <input type="hidden" name="next" value="{{ request.path }}">
    <button class="btn btn--ghost btn--sm" type="submit" name="decision" value="reject"
            data-confirm="Refund {{ r.cost }} points to {{ r.kid_name }}?">Refund</button>
  </form>
</div>
